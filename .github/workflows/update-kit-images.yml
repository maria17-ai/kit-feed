name: Build KIT product images

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Начальная позиция (обычно 0)"
        required: true
        default: "0"
      limit:
        description: "Количество изображений; 0 = все"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build 1200x1200 images
        run: >-
          python build_kit_images.py
          --manifest image_manifest.json
          --output images
          --workers 12
          --start "${{ inputs.start }}"
          --limit "${{ inputs.limit }}"

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images image_failures.json
          if git diff --cached --quiet; then
            echo "Новых изображений нет"
          else
            git commit -m "Build KIT product images"
            git push
          fi
