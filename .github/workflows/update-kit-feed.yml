name: Update KIT feed

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build KIT feed
        run: |
          python3 build_kit_feed.py \
            --kit products.xlsx \
            --output kit_feed.yml \
            --report kit_feed_report.csv

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kit_feed.yml kit_feed_report.csv
          git diff --cached --quiet || git commit -m "Update KIT feed"
          git push
