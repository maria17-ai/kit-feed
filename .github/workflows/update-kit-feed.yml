name: Update KIT feed

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build KIT feed
        run: |
          python3 build_kit_feed.py \
            --kit products.xlsx \
            --output kit_feed.yml \
            --report kit_feed_report.csv

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kit_feed.yml kit_feed_report.csv
          git diff --cached --quiet || git commit -m "Update KIT feed"
          git push

      - name: Prepare feed for GitHub Pages
        run: |
          mkdir -p public
          cp kit_feed.yml public/kit_feed.xml
          touch public/.nojekyll
          printf '<!doctype html><html><body><a href="kit_feed.xml">KIT feed</a></body></html>' > public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
